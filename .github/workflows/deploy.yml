name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# ★ 権限を修正
# JamesIvesのデプロイアクションには contents: write が必須です。
# Pages公式デプロイではないため pages: write や id-token: write は不要になります。
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist  # Viteのビルド成果物フォルダ
          branch: gh-pages       # デプロイ先のブランチ
          clean: true         